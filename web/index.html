<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYBT VFR→IFR Replay</title>
  </head>
  <body>
    <div id="hud">
      <div><strong>LYBT Replay</strong></div>
      <div id="phase">Phase: VFR</div>
      <div id="time">t=0s</div>
      <div class="mt-8">
        <button id="playPause">Play</button>
        <input id="slider" type="range" min="0" max="3600" value="0" />
      </div>
      
      <div class="mt-8">
        <span class="speed-buttons">Speed:</span>
        <button class="spd" data-s="1">1x</button>
        <button class="spd" data-s="5">5x</button>
        <button class="spd" data-s="10">10x</button>
        <button class="spd" data-s="30">30x</button>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>

</html>
